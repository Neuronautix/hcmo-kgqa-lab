name: HCMO pin check

# Report-only check of the vendored HCMO release. It needs NO secrets, no PAT
# and no write permissions, and it never opens PRs or pushes:
#   1. verifies the vendored files against the sha256s in
#      sync/HCMO_SYNC.lock.json (fails the job on tampering / drift),
#   2. runs the upstream competency questions and SHACL checks offline on the
#      vendored release (fails the job if the pinned copy no longer answers
#      the reviewed questions),
#   3. reports in the job summary whether a newer HCMO release exists upstream
#      (informational; does not fail).
# Moving to a new release is a manual, human-reviewed step: see
# docs/hcmo_sync.md ("Moving to a new HCMO release").

on:
  schedule:
    - cron: "17 6 * * 1"  # every Monday 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "sync/**"
      - "ontology/vendor/**"
      - "shapes/vendor/**"
      - "sparql/vendor/**"
      - "kg/vendor/**"
      - "scripts/sync_hcmo.py"
      - "scripts/eval_hcmo_release.py"
      - "app/evaluation/hcmo_release.py"
      - ".github/workflows/sync-hcmo.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl pyyaml requests

      - name: Verify vendored files against the lockfile
        run: python scripts/sync_hcmo.py --verify

      - name: Evaluate the vendored release (competency questions + SHACL)
        shell: bash
        run: |
          status=0
          python scripts/eval_hcmo_release.py > eval.log 2>&1 || status=$?
          cat eval.log
          {
            echo "## Vendored HCMO evaluation"
            echo ""
            echo '```'
            cat eval.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report upstream drift (informational)
        run: python scripts/sync_hcmo.py --check-upstream
